spring.application.name=ventas-service
server.port=8082

# Base de datos H2 en archivo (una por servicio)
spring.datasource.url=jdbc:h2:file:./data/ventas;AUTO_SERVER=TRUE;LOCK_TIMEOUT=10000
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# Configuracion del negocio
ventas.catalogo-url=http://localhost:8081
ventas.reserva-minutos=10
ventas.max-entradas-por-evento=4
