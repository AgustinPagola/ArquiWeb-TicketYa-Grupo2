spring.application.name=catalogo-service
server.port=8081

# Base de datos H2 en archivo (una por servicio)
spring.datasource.url=jdbc:h2:file:./data/catalogo;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# Direccion del servicio de ventas (se usa al cancelar un evento)
ventas.url=http://localhost:8082
